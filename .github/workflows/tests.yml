name: tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repo-files:
    # Code only: fail on built databases, manuals, models or raw downloads (tools/check_repo_files.py)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_repo_files.py

  lint:
    # Only errors that break at run time: syntax errors, undefined names, misplaced statements
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.14.0"
          args: check --select E9,F63,F7,F82 --output-format github

  pytest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.12"}       # the deck's Ubuntu 24.04 Python
          - {os: ubuntu-24.04, python: "3.14"}       # the build PC's
          - {os: ubuntu-24.04-arm, python: "3.12"}   # arm64, like the Orange Pi 5
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Qt runtime libraries (the GUI module is imported, never shown)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Test dependencies
        run: pip install pytest PyQt6 obd numpy "sqlite-vec>=0.1.6"
      - name: sqlite-vec loads and searches (int8 and 1-bit vectors, as the retriever does)
        run: |
          python - <<'PY'
          import random, sqlite3, struct, sqlite_vec
          c = sqlite3.connect(":memory:")
          c.enable_load_extension(True)
          sqlite_vec.load(c)
          c.execute("CREATE VIRTUAL TABLE v USING vec0(id INTEGER PRIMARY KEY, embedding int8[64])")
          c.execute("CREATE VIRTUAL TABLE b USING vec0(id INTEGER PRIMARY KEY, embedding bit[64])")
          rng = random.Random(1)
          for i in range(1, 501):
              blob = struct.pack("64b", *(rng.randint(-127, 127) for _ in range(64)))
              c.execute("INSERT INTO v VALUES (?, vec_int8(?))", (i, blob))
              c.execute("INSERT INTO b VALUES (?, vec_quantize_binary(vec_int8(?)))", (i, blob))
          q = c.execute("SELECT embedding FROM v WHERE id = 42").fetchone()[0]
          top = c.execute("SELECT id FROM b WHERE embedding MATCH vec_quantize_binary(vec_int8(?)) AND k = 5 "
                          "AND id IN (SELECT value FROM json_each('[40,41,42,43]'))", (q,)).fetchall()
          assert top[0][0] == 42, top
          print(c.execute("SELECT vec_version()").fetchone()[0], "ok")
          PY
      - name: Tests (no data files; tests that need a built DB or the RomRaider XML skip and say why)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
